# CI for this repository itself (not the workflows that get planted into other projects;
# those are skills/*/references/ci-*.yml).
name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.9", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install the optional schema cross-check library
        run: python -m pip install jsonschema
      - name: Run tests with an explicit bash and python (versions are printed in the log)
        run: |
          if [ "$RUNNER_OS" = macOS ]; then BASH_BIN=/bin/bash; else BASH_BIN=$(command -v bash); fi
          export BASH_BIN
          PYTHON_BIN=$(command -v python)
          export PYTHON_BIN
          "$BASH_BIN" --version | head -n 1
          "$PYTHON_BIN" --version
          "$BASH_BIN" tests/run.sh
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck (warnings and above)
        run: |
          shellcheck --version
          shellcheck --severity=warning \
            skills/*/scripts/*.sh install.sh build/*.sh \
            tests/*.sh tests/scenarios/*.sh
